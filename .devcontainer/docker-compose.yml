# Entorno de desarrollo para GitHub Codespaces / VS Code Dev Containers.
# Las contraseñas de aquí son SOLO para este entorno desechable; nunca se usan en producción.
services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tekcom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Codespace.Dev1"
    ports:
      - "5432:5432"
