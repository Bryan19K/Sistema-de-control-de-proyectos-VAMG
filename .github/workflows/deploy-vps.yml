name: Publicar en el VPS

# Cada integración a main: compila, prueba, construye la imagen Docker, la sube a ghcr.io y la despliega
# por SSH en el servidor. También se puede lanzar a mano desde la pestaña Actions.
# Requiere los secretos VPS_HOST, VPS_USER y VPS_SSH_KEY (ver docs/DESPLIEGUE.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-vps
  cancel-in-progress: false

jobs:
  probar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Tekcom.Gestion.sln
      - run: dotnet build Tekcom.Gestion.sln --configuration Release --no-restore
      - run: dotnet test Tekcom.Gestion.sln --configuration Release --no-build

  desplegar:
    name: Construir imagen y desplegar
    needs: probar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Verificar que estén los secretos del servidor
        run: |
          missing=""
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos en el repositorio:$missing. Ver docs/DESPLIEGUE.md (paso 4)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Nombre de la imagen (ghcr.io exige minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Preparar la conexión SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copiar archivos de despliegue al servidor
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh \
            "$VPS_USER@$VPS_HOST:/opt/tekcom/"

      - name: Desplegar
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "chmod +x /opt/tekcom/*.sh && bash /opt/tekcom/deploy.sh '${IMAGE}:${GITHUB_SHA}' '${GHCR_USER}'"
