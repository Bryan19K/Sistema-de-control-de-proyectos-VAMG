name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar paquetes
        run: dotnet restore Tekcom.Gestion.sln

      - name: Compilar
        run: dotnet build Tekcom.Gestion.sln --configuration Release --no-restore

      - name: Pruebas
        run: dotnet test Tekcom.Gestion.sln --configuration Release --no-build --logger "trx;LogFileName=resultados.trx" --results-directory TestResults

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults

  docker-build:
    name: Construir imagen Docker
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen (sin publicarla)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
